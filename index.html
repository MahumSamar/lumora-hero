<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lumora — Immersive Visuals</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #010205;
    --text: #ffffff;
    --muted: rgba(220, 232, 255, 0.72);
    --link: rgba(235, 242, 255, 0.82);
    --cyan: #19e3f5;
    --cyan-2: #5df0ff;
    --blue: #1f6bff;
    --pad: clamp(16px, 3.2vw, 44px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .hero {
    position: relative;
    min-height: 100vh; min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background:
      var(--bg);
  }

  /* ---------- 3D STAGE ---------- */
  .stage {
    position: absolute; inset: 0; z-index: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  #gl {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #gl.ready { opacity: 1; }
  .loader {
    position: absolute; left: 50%; top: 56%; translate: -50% -50%;
    width: 120px; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(60, 190, 255, 0.55), rgba(20, 80, 255, 0.12) 50%, transparent 70%);
    filter: blur(8px);
    animation: pulse 1.6s ease-in-out infinite;
    transition: opacity .6s;
  }
  .loader.hide { opacity: 0; }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* ---------- NAV ---------- */
  .nav {
    position: relative; z-index: 3;
    display: flex; align-items: center;
    padding: clamp(18px, 3vw, 34px) var(--pad) 0;
    gap: clamp(24px, 6vw, 80px);
  }
  .brand { font-weight: 700; font-size: clamp(22px, 2vw, 28px); letter-spacing: -0.02em; }
  .links { display: flex; gap: clamp(16px, 1.8vw, 26px); font-size: 15px; color: var(--link); }
  .links a { position: relative; transition: color .25s; }
  .links a:hover, .links a.active { color: #fff; }
  .links a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 1px;
    background: var(--cyan); transform: scaleX(0); transform-origin: left; transition: transform .3s;
  }
  .links a:hover::after { transform: scaleX(1); }
  .join {
    margin-left: auto; font-size: 16px; font-weight: 500;
    padding-bottom: 4px; border-bottom: 1.5px solid #fff;
    transition: color .25s, border-color .25s;
  }
  .join:hover { color: var(--cyan); border-color: var(--cyan); }
  .burger { display: none; margin-left: auto; width: 38px; height: 38px; border: 0; background: none; cursor: pointer; }
  .burger span { display: block; width: 22px; height: 1.5px; background: #fff; margin: 6px auto; transition: transform .3s, opacity .3s; }

  /* ---------- HEADLINE ROW ---------- */
  .top {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: minmax(120px, 18%) 1fr auto;
    align-items: start;
    padding: clamp(36px, 7vh, 80px) var(--pad) 0;
  }
  .counter { font-size: 14px; color: #fff; letter-spacing: 0.02em; padding-top: 10px; }
  .counter b { font-weight: 600; }
  .counter span { color: var(--muted); }
  .dots-mini { display: flex; gap: 6px; margin-top: 12px; }
  .dots-mini i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots-mini i:first-child { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  h1 {
    font-weight: 600;
    font-size: clamp(34px, 4.6vw, 66px);
    line-height: 0.98;
    letter-spacing: -0.035em;
    text-transform: uppercase;
  }
  h1 .line { display: block; overflow: hidden; }
  h1 .line > span { display: inline-block; transform: translateY(105%); animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .12s; }
  @keyframes rise { to { transform: none; } }
  .more { display: flex; gap: 6px; padding: 14px 8px 0 0; margin-right: clamp(0px, 18vw, 300px); }
  .more i { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  /* ---------- SIDE CARD ---------- */
  .card {
    position: absolute; z-index: 2;
    right: clamp(16px, 3.4vw, 50px);
    bottom: clamp(20px, 4vh, 38px);
    width: min(260px, 26vw);
    opacity: 0; animation: fade 1s .5s ease forwards;
  }
  .card h2 { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; margin-bottom: 18px; }
  .card p { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 26px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--cyan); color: #00121a;
    font-weight: 600; font-size: 14.5px;
    padding: 12px 22px; border-radius: 4px;
    box-shadow: 0 0 0 0 rgba(25, 227, 245, .5);
    transition: transform .25s, box-shadow .35s, background .25s;
  }
  .cta:hover { background: var(--cyan-2); transform: translateY(-2px); box-shadow: 0 10px 34px -6px rgba(25, 227, 245, .65); }
  .cta svg { transition: transform .25s; }
  .cta:hover svg { transform: translateX(3px); }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- BOTTOM ---------- */
  .bottom {
    position: absolute; z-index: 2; left: 0; right: 0;
    bottom: clamp(20px, 4vh, 38px);
    display: grid; grid-template-columns: minmax(120px, 18%) 1fr;
    align-items: end;
    padding: 0 var(--pad);
  }
  .social { display: grid; gap: 8px; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--link); }
  .social a:hover { color: var(--cyan); }
  .discover { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; justify-self: start; }
  .discover svg { animation: bob 2s ease-in-out infinite; }
  .discover:hover { color: var(--cyan); }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* ---------- TABLET ---------- */
  @media (max-width: 1024px) {
    .stage { top: 4vh; }
    .card { bottom: clamp(20px, 4vh, 38px); }
    .more { margin-right: 0; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 720px) {
    .links, .join { display: none; }
    .burger { display: block; }
    .nav.open .links {
      display: flex; flex-direction: column; gap: 18px;
      position: absolute; top: 100%; left: var(--pad); right: var(--pad);
      margin-top: 14px; padding: 20px;
      background: rgba(6, 12, 24, .85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px; font-size: 17px;
    }
    .nav.open .burger span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav.open .burger span:nth-child(2) { opacity: 0; }
    .nav.open .burger span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    .hero { display: flex; flex-direction: column; }
    .top { grid-template-columns: 1fr auto; padding-top: 28px; row-gap: 18px; }
    .counter { grid-column: 1 / -1; padding-top: 0; display: flex; align-items: center; gap: 12px; }
    .dots-mini { margin-top: 0; }
    h1 { font-size: clamp(32px, 10vw, 46px); }
    .more { display: none; }

    .nav { order: 0; } .top { order: 1; } .stage { order: 2; } .card { order: 3; } .bottom { order: 4; }
    .stage { position: relative; inset: auto; display: flex; justify-content: center; align-items: center; height: 80vw; min-height: 280px; overflow: visible; }
    .stage { top: auto; height: 96vw; min-height: 320px; margin: -6vw 0 -4vw;
      -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); }

    .card { position: relative; right: auto; top: auto; bottom: auto; width: auto; padding: 0 var(--pad); margin-top: 6px; }
    .card h2 { font-size: 19px; margin-bottom: 10px; }
    .card p { margin-bottom: 20px; max-width: 340px; }

    .bottom {
      position: relative; bottom: auto; margin-top: auto;
      padding: 36px var(--pad) 28px;
      grid-template-columns: 1fr auto;
    }
    .social { grid-auto-flow: column; gap: 18px; font-size: 13px; }
    .discover { font-size: 13px; justify-self: end; }
  }

  @media (prefers-reduced-motion: reduce) {
    .loader, .discover svg { animation: none; }
    h1 .line > span { animation: none; transform: none; }
    .card { animation: none; opacity: 1; }
  }
</style>
</head>

  // Mobile menu
  const nav = document.getElementById('nav');

  burger.addEventListener('click', () => {

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  // Higgsfield 3D model — built with multi_image_to_3d from the close-up model sheet (front / 3/4 / top views)
  const ORB_GLB = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_202332_9ca7052f-8d5e-4803-9431-d0eaff627b54.glb';

  const canvas = document.getElementById('gl');
  const stage = canvas.parentElement;
  const loader = document.getElementById('loader');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile = matchMedia('(max-width: 720px)');

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.02).texture;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 10);

  scene.add(new THREE.AmbientLight(0x88aaff, 0.25));
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 4, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0x5aa0ff, 1.0); fill.position.set(-4, -1, 3); scene.add(fill);
  const glowL = new THREE.PointLight(0x47b8ff, 6, 5, 2); scene.add(glowL); // orb light spilling on the rings

  const system = new THREE.Group();     // pointer-tilted
  scene.add(system);
  const floatG = new THREE.Group();     // gentle float
  system.add(floatG);

  // ---------- shared wobble field ----------
  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    float wobble(vec3 d){
      return snoise(d*1.1 + vec3(uTime*0.30, uTime*0.21, -uTime*0.26)) * uAmp
           + snoise(d*2.3 - vec3(uTime*0.42)) * uAmp * 0.3;
    }`;
  // Higgsfield orb render, projected onto the 3D blob from the camera so it reads exactly like the image
  const ORB_IMG = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_200844_5fa95511-57c1-4919-8acf-9136e1a125c5.png';
  const blank = new THREE.DataTexture(new Uint8Array([8, 40, 160, 255]), 1, 1); blank.needsUpdate = true;
  const U = {
    uTime: { value: 0 }, uAmp: { value: 0.07 }, uR: { value: 1 },
    uTex: { value: blank }, uImgC: { value: new THREE.Vector2(0.495, 0.5) }, uImgR: { value: 0.33 }
  };
  new THREE.TextureLoader().setCrossOrigin('anonymous').load(ORB_IMG, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    U.uTex.value = t;
  });

  // ---------- blob: liquid glass with the swirling galaxy image inside ----------
  const blobMat = new THREE.ShaderMaterial({
    uniforms: U,
    vertexShader: `
      uniform float uTime; uniform float uAmp; uniform float uR;
      ${NOISE}
      varying vec3 vN; varying vec3 vV; varying vec2 vQ;
      void main(){
        vec3 d = normalize(position);
        float L0 = length(position);
        vec3 p = position + d * wobble(d) * L0;
        vec3 t1 = normalize(cross(d, vec3(0.0,1.0,0.001)));
        vec3 t2 = cross(d, t1);
        vec3 pa = normalize(d + t1*0.02); vec3 pb = normalize(d + t2*0.02);
        vec3 qa = pa*(L0 + wobble(pa)*L0); vec3 qb = pb*(L0 + wobble(pb)*L0);
        vec3 n = normalize(cross(qa - p, qb - p));
        if (dot(n, normal) < 0.0) n = -n;
        vN = normalize(normalMatrix * mix(normal, n, 0.85));
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vec4 c = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        float rv = length((modelViewMatrix * vec4(uR, 0.0, 0.0, 0.0)).xyz);
        vQ = (mv.xy - c.xy) / rv;          // -1..1 across the visible silhouette
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uAmp; uniform sampler2D uTex; uniform vec2 uImgC; uniform float uImgR;
      ${NOISE}
      varying vec3 vN; varying vec3 vV; varying vec2 vQ;
      vec2 rot(vec2 v, float a){ float s = sin(a), c = cos(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
      void main(){
        vec3 n = normalize(vN);
        float facing = clamp(dot(n, vV), 0.0, 1.0);
        vec2 q = vQ;
        float r = length(q);
        // flowing vortex: steady spin + a breathing twist that is stronger near the core
        float a = uTime * 0.16 + sin(uTime * 0.45) * (1.0 - smoothstep(0.0, 1.0, r)) * 0.55;
        q = rot(q, a);
        q += 0.022 * vec2(snoise(vec3(q * 3.0, uTime * 0.35)), snoise(vec3(q * 3.0 + 7.3, uTime * 0.35)));
        vec2 uv = uImgC + q * 0.94 * uImgR;
        vec3 col = texture2D(uTex, uv).rgb;
        // core breathes
        col += vec3(0.55, 0.85, 1.0) * exp(-r * r * 18.0) * (0.25 + 0.15 * sin(uTime * 1.3));
        // liquid-glass skin: cyan fresnel rim + sharp highlights
        float fres = pow(1.0 - facing, 3.0);
        col += vec3(0.1, 0.55, 1.0) * fres * 0.55;
        vec3 L1 = normalize(vec3(0.35, 0.7, 0.6));
        vec3 L2 = normalize(vec3(-0.7, -0.2, 0.6));
        col += vec3(0.8, 0.95, 1.0) * pow(max(dot(reflect(-L1, n), vV), 0.0), 70.0) * 0.5;
        col += vec3(0.4, 0.8, 1.0) * pow(max(dot(reflect(-L2, n), vV), 0.0), 30.0) * 0.35;
        gl_FragColor = vec4(col * 1.1, 1.0);
      }`
  });

  const blobHolder = new THREE.Group();
  floatG.add(blobHolder);
  // procedural fallback (replaced by the Higgsfield mesh once it loads)
  const fallback = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 64), blobMat);
  blobHolder.add(fallback);

  // Keep only the blob part of the Higgsfield mesh (rings are rebuilt as clean geometry below)
  function extractBlob(geo, cut) {
    const pos = geo.attributes.position;
    const idx = geo.index ? geo.index.array : [...Array(pos.count).keys()];
    const keep = [];
    const v = new THREE.Vector3();
    const r = (i) => v.fromBufferAttribute(pos, i).length();
    for (let i = 0; i < idx.length; i += 3) {
      if (r(idx[i]) < cut && r(idx[i + 1]) < cut && r(idx[i + 2]) < cut) keep.push(idx[i], idx[i + 1], idx[i + 2]);
    }
    const g = geo.clone();
    g.setIndex(keep);
    g.computeVertexNormals();
    return g;
  }

  new GLTFLoader().load(ORB_GLB, (gltf) => {
    gltf.scene.updateMatrixWorld(true);
    const meshes = [];
    gltf.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
    if (!meshes.length) return;
    // bake transforms, then centre on the combined bounds
    const geos = meshes.map((m) => { const g = m.geometry.clone(); g.applyMatrix4(m.matrixWorld); return { g, map: m.material.map }; });
    const box = new THREE.Box3();
    geos.forEach(({ g }) => { g.computeBoundingBox(); box.union(g.boundingBox); });
    const c = box.getCenter(new THREE.Vector3());
    let maxR = 0;
    geos.forEach(({ g }) => {
      g.translate(-c.x, -c.y, -c.z);
      const p = g.attributes.position, v = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) maxR = Math.max(maxR, v.fromBufferAttribute(p, i).length());
    });
    // vertex radius histogram → find the blob surface (dense band) vs the outer rings
    const bins = new Array(60).fill(0);
    geos.forEach(({ g }) => {
      const p = g.attributes.position, v = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) bins[Math.min(59, Math.floor(v.fromBufferAttribute(p, i).length() / maxR * 60))]++;
    });
    let peak = 0; for (let i = 1; i < 52; i++) if (bins[i] > bins[peak]) peak = i;
    let cutBin = peak; while (cutBin < 59 && bins[cutBin + 1] > bins[peak] * 0.04) cutBin++;
    const cut = ((cutBin + 1.5) / 60) * maxR;

    const group = new THREE.Group();
    let blobR = 0;
    geos.forEach(({ g, map }) => {
      const bg = extractBlob(g, cut);
      const p = bg.attributes.position, v = new THREE.Vector3();
      for (let k = 0; k < bg.index.count; k++) blobR = Math.max(blobR, v.fromBufferAttribute(p, bg.index.getX(k)).length());

      group.add(new THREE.Mesh(bg, blobMat));
    });
    if (blobR > 0) {
      group.scale.setScalar(1 / blobR);
      U.uR.value = blobR;
      blobHolder.remove(fallback);
      blobHolder.add(group);
    }
  }, undefined, (err) => console.warn('Higgsfield GLB failed — procedural blob used', err));

  // ---------- rings: a ribbon of thin glass strands + glass beads (torus + array, as in the Blender scene) ----------
  const ringRoot = new THREE.Group();
  ringRoot.rotation.set(-1.34, -0.12, -0.56);     // upper-left → lower-right sweep (keeps clear of the right-hand copy)
  floatG.add(ringRoot);

  // clear glass: transparent body, cyan fresnel edges, crisp specular glints (additive so it glows on black)
  function glass(edge, body, glint) {
    return new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexShader: `
        varying vec3 vN; varying vec3 vV;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vN; varying vec3 vV;
        void main(){
          vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
          float f = 1.0 - abs(dot(n, vV));
          vec3 col = vec3(0.08, 0.38, 1.0) * ${body.toFixed(3)}
                   + vec3(0.22, 0.72, 1.0) * pow(f, 2.4) * ${edge.toFixed(3)};
          vec3 L1 = normalize(vec3(0.35, 0.7, 0.6));
          vec3 L2 = normalize(vec3(-0.6, -0.35, 0.7));
          float s1 = pow(max(dot(reflect(-L1, n), vV), 0.0), 90.0);
          float s2 = pow(max(dot(reflect(-L2, n), vV), 0.0), 40.0);
          // caustic: light focused through the glass onto the far side
          float caus = pow(max(dot(n, -L1), 0.0), 6.0) * 0.35;
          col += vec3(0.85, 0.97, 1.0) * (s1 * ${glint.toFixed(3)} + s2 * 0.35) + vec3(0.3, 0.8, 1.0) * caus;
          gl_FragColor = vec4(col, 1.0);
        }`
    });
  }
  const strandMat = glass(0.85, 0.10, 1.2);
  const beadMat = glass(1.25, 0.06, 2.6);
  const beadGeo = new THREE.SphereGeometry(1, 40, 28);

  const rand = (() => { let s = 7; return (a = 0, b = 1) => { s = (s * 16807) % 2147483647; return a + (s / 2147483647) * (b - a); }; })();
  const strands = [];
  const N = 16;
  for (let i = 0; i < N; i++) {
    const k = i / (N - 1) - 0.5;              // -0.5 … 0.5 across the ribbon
    const R = 1.6 + k * 0.5 + rand(-0.02, 0.02);
    const tiltG = new THREE.Group();
    // each strand tilted a touch differently: bundled in front, splaying apart at the ends
    tiltG.rotation.x = k * 0.20 + rand(-0.02, 0.02);
    tiltG.rotation.y = k * 0.07;
    ringRoot.add(tiltG);
    const spin = new THREE.Group();
    tiltG.add(spin);
    spin.add(new THREE.Mesh(new THREE.TorusGeometry(R, rand(0.0035, 0.0075), 8, 560), strandMat));
    const beads = 3 + Math.floor(rand() * 5);
    for (let b = 0; b < beads; b++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(0.022, 0.06) * (rand() < 0.18 ? 1.6 : 1);
      const m = new THREE.Mesh(beadGeo, beadMat);
      m.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
      m.scale.setScalar(s);
      spin.add(m);
    }
    // fine dotted micro-beads along some strands
    if (i % 3 === 0) {
      for (let b = 0; b < 26; b++) {
        const a = (b / 26) * Math.PI * 2 + rand(0, 0.2);
        const m = new THREE.Mesh(beadGeo, beadMat);
        m.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
        m.scale.setScalar(rand(0.008, 0.016));
        spin.add(m);
      }
    }
    strands.push({ spin, speed: rand(0.09, 0.22) * (i % 2 ? 1 : 1.2) });
  }

  // soft blue glow behind the orb
  const gc = document.createElement('canvas'); gc.width = gc.height = 256;
  const gx = gc.getContext('2d');
  const grd = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(60,150,255,0.55)'); grd.addColorStop(0.4, 'rgba(30,90,255,0.18)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  gx.fillStyle = grd; gx.fillRect(0, 0, 256, 256);
  const glowTex = new THREE.CanvasTexture(gc); glowTex.colorSpace = THREE.SRGBColorSpace;
  const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glowSprite.scale.set(4.2, 4.2, 1);
  glowSprite.position.z = -1.2;
  glowSprite.renderOrder = -1;
  // glow sprite intentionally not added (no halo behind the orb)

  // ---------- bloom ----------
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.38, 0.45, 0.88);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ---------- layout ----------
  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const dpr = Math.min(devicePixelRatio, mobile.matches ? 1.5 : 2);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
    composer.setPixelRatio(dpr); composer.setSize(w, h);
    camera.aspect = w / h;
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const wantH = mobile.matches ? 2 / 0.7 : 2 / 0.66;            // blob ≈ 66% of hero height
    const wantW = 4.4 / (mobile.matches ? 1.35 : 0.97);            // ring span vs width
    const visH = Math.max(wantH, wantW / camera.aspect);
    camera.position.z = visH / (2 * Math.tan(vFov / 2));
    system.position.y = mobile.matches ? 0 : -visH * 0.06;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(fit).observe(stage);
  fit();

  // ---------- interaction ----------
  let tx = 0, ty = 0, cx = 0, cy = 0, near = 0, nearS = 0, pulse = 0;
  const setT = (x, y) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); };
  addEventListener('pointermove', (e) => {
    setT((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
    const r = stage.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height * (mobile.matches ? 0.5 : 0.56);
    near = Math.max(0, 1 - Math.hypot(e.clientX - ox, e.clientY - oy) / (r.height * 0.4));
  }, { passive: true });
  document.addEventListener('pointerleave', () => { setT(0, 0); near = 0; });
  addEventListener('pointerdown', () => { pulse = 1; }, { passive: true });
  addEventListener('deviceorientation', (e) => { if (e.gamma != null) setT(e.gamma / 30, (e.beta - 45) / 30); }, { passive: true });

  // ---------- loop ----------
  const clock = new THREE.Clock();
  let first = true, t = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const sp = reduce ? 0.15 : 1;
    t += dt * sp;
    cx += (tx - cx) * 0.05; cy += (ty - cy) * 0.05;
    nearS += (near - nearS) * 0.05; pulse *= 0.94;

    U.uTime.value = t * (1 + nearS * 0.7);
    U.uAmp.value = 0.065 + nearS * 0.06 + pulse * 0.1;

    system.rotation.y = cx * 0.36;
    system.rotation.x = cy * 0.24;
    floatG.position.y = Math.sin(t * 0.7) * 0.05;
    blobHolder.rotation.y = Math.sin(t * 0.25) * 0.25;
    blobHolder.rotation.z += dt * 0.04 * sp;
    blobHolder.scale.setScalar(1 + nearS * 0.035 + pulse * 0.05);

    const boost = 1 + nearS * 1.1 + pulse * 2;
    for (const s of strands) s.spin.rotation.z += dt * s.speed * boost * sp;

    composer.render();
    if (first) { first = false; canvas.classList.add('ready'); loader.classList.add('hide'); }
  });
</script>
</body>
</html>
