<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lumora — Immersive Visuals</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #010205;
    --text: #ffffff;
    --muted: rgba(220, 232, 255, 0.72);
    --link: rgba(235, 242, 255, 0.82);
    --cyan: #19e3f5;
    --cyan-2: #5df0ff;
    --blue: #1f6bff;
    --pad: clamp(16px, 3.2vw, 44px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .hero {
    position: relative;
    min-height: 100vh; min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(60% 55% at 50% 55%, rgba(18, 70, 160, 0.20), transparent 70%),
      var(--bg);
  }

  /* ---------- 3D STAGE ---------- */
  .stage {
    position: absolute; inset: 0; z-index: 0;
    display: grid; place-items: center;
    perspective: 1400px;
    pointer-events: none;
  }
  .orb {
    position: relative;
    width: min(98vw, 112vh, 1560px);
    aspect-ratio: 16 / 9;
    margin-top: 12vh;
    transform-style: preserve-3d;
    will-change: transform;
    animation: float 9s ease-in-out infinite;
  }
  .orb-inner {
    position: absolute; inset: 0;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translate3d(var(--tx, 0px), var(--ty, 0px), 0) scale(var(--s, 1));
    transition: transform 0.9s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }
  .orb video, .orb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    mix-blend-mode: screen;
    /* feather the frame edges into the background */
    -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  }
  .orb video { transform: scale(1.12); }
  .orb img { opacity: 1; transition: opacity 0.8s ease; }
  .orb.playing img { opacity: 0; }
  .glow {
    position: absolute; left: 50%; top: 50%;
    width: 46%; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(40, 170, 255, 0.35), rgba(20, 80, 255, 0.10) 45%, transparent 70%);
    filter: blur(30px);
    animation: pulse 5s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes float {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, -14px, 0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  /* ---------- NAV ---------- */
  .nav {
    position: relative; z-index: 3;
    display: flex; align-items: center;
    padding: clamp(18px, 3vw, 34px) var(--pad) 0;
    gap: clamp(24px, 6vw, 80px);
  }
  .brand { font-weight: 700; font-size: clamp(22px, 2vw, 28px); letter-spacing: -0.02em; }
  .links { display: flex; gap: clamp(16px, 1.8vw, 26px); font-size: 15px; color: var(--link); }
  .links a { position: relative; transition: color .25s; }
  .links a:hover, .links a.active { color: #fff; }
  .links a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 1px;
    background: var(--cyan); transform: scaleX(0); transform-origin: left; transition: transform .3s;
  }
  .links a:hover::after { transform: scaleX(1); }
  .join {
    margin-left: auto; font-size: 16px; font-weight: 500;
    padding-bottom: 4px; border-bottom: 1.5px solid #fff;
    transition: color .25s, border-color .25s;
  }
  .join:hover { color: var(--cyan); border-color: var(--cyan); }
  .burger { display: none; margin-left: auto; width: 38px; height: 38px; border: 0; background: none; cursor: pointer; }
  .burger span { display: block; width: 22px; height: 1.5px; background: #fff; margin: 6px auto; transition: transform .3s, opacity .3s; }

  /* ---------- HEADLINE ROW ---------- */
  .top {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: minmax(120px, 18%) 1fr auto;
    align-items: start;
    padding: clamp(36px, 7vh, 80px) var(--pad) 0;
  }
  .counter { font-size: 14px; color: #fff; letter-spacing: 0.02em; padding-top: 10px; }
  .counter b { font-weight: 600; }
  .counter span { color: var(--muted); }
  .dots-mini { display: flex; gap: 6px; margin-top: 12px; }
  .dots-mini i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots-mini i:first-child { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  h1 {
    font-weight: 600;
    font-size: clamp(34px, 4.6vw, 66px);
    line-height: 0.98;
    letter-spacing: -0.035em;
    text-transform: uppercase;
  }
  h1 .line { display: block; overflow: hidden; }
  h1 .line > span { display: inline-block; transform: translateY(105%); animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .12s; }
  @keyframes rise { to { transform: none; } }
  .more { display: flex; gap: 6px; padding: 14px 8px 0 0; margin-right: clamp(0px, 18vw, 300px); }
  .more i { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  /* ---------- SIDE CARD ---------- */
  .card {
    position: absolute; z-index: 2;
    right: clamp(16px, 3.4vw, 50px);
    top: 62%;
    width: min(260px, 26vw);
    opacity: 0; animation: fade 1s .5s ease forwards;
  }
  .card h2 { font-weight: 500; font-size: 20px; letter-spacing: -0.01em; margin-bottom: 18px; }
  .card p { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 26px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--cyan); color: #00121a;
    font-weight: 600; font-size: 14.5px;
    padding: 12px 22px; border-radius: 4px;
    box-shadow: 0 0 0 0 rgba(25, 227, 245, .5);
    transition: transform .25s, box-shadow .35s, background .25s;
  }
  .cta:hover { background: var(--cyan-2); transform: translateY(-2px); box-shadow: 0 10px 34px -6px rgba(25, 227, 245, .65); }
  .cta svg { transition: transform .25s; }
  .cta:hover svg { transform: translateX(3px); }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- BOTTOM ---------- */
  .bottom {
    position: absolute; z-index: 2; left: 0; right: 0;
    bottom: clamp(20px, 4vh, 38px);
    display: grid; grid-template-columns: minmax(120px, 18%) 1fr;
    align-items: end;
    padding: 0 var(--pad);
  }
  .social { display: grid; gap: 8px; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--link); }
  .social a:hover { color: var(--cyan); }
  .discover { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; justify-self: start; }
  .discover svg { animation: bob 2s ease-in-out infinite; }
  .discover:hover { color: var(--cyan); }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* ---------- TABLET ---------- */
  @media (max-width: 1024px) {
    .orb { width: 112vw; margin-top: 4vh; }
    .card { top: auto; bottom: 120px; }
    .more { margin-right: 0; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 720px) {
    .links, .join { display: none; }
    .burger { display: block; }
    .nav.open .links {
      display: flex; flex-direction: column; gap: 18px;
      position: absolute; top: 100%; left: var(--pad); right: var(--pad);
      margin-top: 14px; padding: 20px;
      background: rgba(6, 12, 24, .85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px; font-size: 17px;
    }
    .nav.open .burger span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav.open .burger span:nth-child(2) { opacity: 0; }
    .nav.open .burger span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    .hero { display: flex; flex-direction: column; }
    .top { grid-template-columns: 1fr auto; padding-top: 28px; row-gap: 18px; }
    .counter { grid-column: 1 / -1; padding-top: 0; display: flex; align-items: center; gap: 12px; }
    .dots-mini { margin-top: 0; }
    h1 { font-size: clamp(32px, 10vw, 46px); }
    .more { display: none; }

    .nav { order: 0; } .top { order: 1; } .stage { order: 2; } .card { order: 3; } .bottom { order: 4; }
    .stage { position: relative; inset: auto; display: flex; justify-content: center; align-items: center; height: 80vw; min-height: 280px; overflow: visible; }
    .orb { width: 150vw; flex: none; margin-top: 0; }

    .card { position: relative; right: auto; top: auto; bottom: auto; width: auto; padding: 0 var(--pad); margin-top: 6px; }
    .card h2 { font-size: 19px; margin-bottom: 10px; }
    .card p { margin-bottom: 20px; max-width: 340px; }

    .bottom {
      position: relative; bottom: auto; margin-top: auto;
      padding: 36px var(--pad) 28px;
      grid-template-columns: 1fr auto;
    }
    .social { grid-auto-flow: column; gap: 18px; font-size: 13px; }
    .discover { font-size: 13px; justify-self: end; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb, .glow, .discover svg { animation: none; }
    h1 .line > span { animation: none; transform: none; }
    .card { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="stage" aria-hidden="true">
    <div class="orb" id="orb">
      <div class="orb-inner" id="orbInner">
        <div class="glow"></div>
        <img id="poster" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_172652_b072a97e-ffec-48cc-9a66-a9587d496e1a.png" />
        <video id="orbVideo" autoplay muted loop playsinline preload="auto" poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_172652_b072a97e-ffec-48cc-9a66-a9587d496e1a.png">
          <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_172740_3e5dd450-52f2-4537-940d-450e87ef9aeb.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <a href="#" class="brand">Lumora.</a>
    <div class="links">
      <a href="#" class="active">Showcase</a>
      <a href="#">Use Cases</a>
      <a href="#">Innovation</a>
      <a href="#">Connect</a>
    </div>
    <a href="#" class="join">Apply Now</a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </nav>

  <div class="top">
    <div class="counter">
      <div><b>001</b><span>/005</span></div>
      <div class="dots-mini"><i></i><i></i><i></i></div>
    </div>
    <h1>
      <span class="line"><span>The next leap</span></span>
      <span class="line"><span>in living visuals.</span></span>
    </h1>
    <div class="more" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <aside class="card">
    <h2>3D Lumora Engines.</h2>
    <p>Living 3D engines that sense, adapt, and respond in real time to unite imagination and compute.</p>
    <a href="#" class="cta">Enter the Studio
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </aside>

  <div class="bottom">
    <div class="social">
      <a href="#">Instagram</a>
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
    </div>
    <a href="#" class="discover">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
      Continue
    </a>
  </div>
</section>

<script>
  // Mobile menu
  const nav = document.getElementById('nav');
  const burger = document.getElementById('burger');
  burger.addEventListener('click', () => {
    const open = nav.classList.toggle('open');
    burger.setAttribute('aria-expanded', open);
  });

  // Video: fade out poster once frames are flowing
  const orb = document.getElementById('orb');
  const video = document.getElementById('orbVideo');
  video.addEventListener('playing', () => orb.classList.add('playing'));
  video.play().catch(() => {});

  // 3D tilt / parallax interaction (pointer + touch + gyro)
  const inner = document.getElementById('orbInner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tx = 0, ty = 0, cx = 0, cy = 0, hover = 0, ch = 0;

  function setTarget(nx, ny) { tx = Math.max(-1, Math.min(1, nx)); ty = Math.max(-1, Math.min(1, ny)); }
  addEventListener('pointermove', e => {
    setTarget((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
    // proximity "swell" when pointer nears the orb centre
    const r = orb.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    hover = Math.max(0, 1 - Math.hypot(dx, dy) / (r.height * 0.6));
  }, { passive: true });
  document.addEventListener('pointerleave', () => { setTarget(0, 0); hover = 0; });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    setTarget(e.gamma / 30, (e.beta - 45) / 30);
  }, { passive: true });

  inner.style.transition = 'none';
  (function loop() {
    if (!reduce) {
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06; ch += (hover - ch) * 0.05;
      inner.style.setProperty('--ry', (cx * 12).toFixed(2) + 'deg');
      inner.style.setProperty('--rx', (-cy * 9).toFixed(2) + 'deg');
      inner.style.setProperty('--tx', (cx * 26).toFixed(1) + 'px');
      inner.style.setProperty('--ty', (cy * 18).toFixed(1) + 'px');
      inner.style.setProperty('--s', (1 + ch * 0.035).toFixed(4));
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
